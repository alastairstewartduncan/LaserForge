name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LaserForge.sln

      - name: Build
        run: dotnet build LaserForge.sln -c Release --no-restore -p:BuildNumber=${{ github.run_number }}

      - name: Core tests
        run: dotnet run --project tests/LaserForge.Core.Tests -c Release --no-build

      - name: Publish Windows app (self-contained, single file)
        run: dotnet publish src/LaserForge.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:BuildNumber=${{ github.run_number }} -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: LaserForge-win-x64-build${{ github.run_number }}
          path: publish/

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#0E1015"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A9BCFF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E97A8"/>
      <stop offset="0.45" stop-color="#E3E7EE"/>
      <stop offset="1" stop-color="#7C8596"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.25" stop-color="#FFE3B0"/>
      <stop offset="0.6" stop-color="#FF8A2A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- path still to be burned -->
  <path d="M128 186 C 148 160, 172 214, 214 174" fill="none" stroke="#5A6272" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="2 13"/>
  <!-- burned trace: glow + core -->
  <path d="M42 176 C 74 136, 104 214, 128 186" fill="none" stroke="#FF7A1A" stroke-width="16"
        stroke-linecap="round" opacity="0.45" filter="url(#glow)"/>
  <path d="M42 176 C 74 136, 104 214, 128 186" fill="none" stroke="#FF8F33" stroke-width="8" stroke-linecap="round"/>
  <path d="M42 176 C 74 136, 104 214, 128 186" fill="none" stroke="#FFD29A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- beam -->
  <rect x="119" y="100" width="18" height="86" rx="9" fill="#7D97FF" opacity="0.55" filter="url(#glow)"/>
  <rect x="124.5" y="100" width="7" height="86" rx="3.5" fill="url(#beam)"/>
  <rect x="126.8" y="100" width="2.4" height="86" rx="1.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- laser head -->
  <rect x="94" y="30" width="68" height="46" rx="10" fill="url(#body)"/>
  <rect x="94" y="44" width="68" height="5" fill="#000" opacity="0.18"/>
  <rect x="94" y="56" width="68" height="5" fill="#000" opacity="0.18"/>
  <path d="M106 76 H150 L138 100 H118 Z" fill="#5E6676"/>
  <rect x="118" y="97" width="20" height="5" rx="2" fill="#3C424E"/>

  <!-- hot spot -->
  <circle cx="128" cy="186" r="30" fill="url(#hot)"/>
  <g stroke="#FFE7C2" stroke-linecap="round" stroke-width="3">
    <line x1="128" y1="166" x2="128" y2="160"/>
    <line x1="146" y1="180" x2="153" y2="177"/>
    <line x1="110" y1="180" x2="103" y2="177"/>
    <line x1="141" y1="199" x2="147" y2="205"/>
    <line x1="115" y1="199" x2="109" y2="205"/>
  </g>
  <circle cx="128" cy="186" r="5.5" fill="#FFFFFF"/>
</svg>
